[workspace]
resolver = "2"
members = ["crates/galaxian-core", "crates/galaxian-cli", "crates/galaxian-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Farquaad56"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
