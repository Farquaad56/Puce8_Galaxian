[package]
name = "galaxian-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Galaxian (Namco/Midway 1979) arcade board core: cycle-exact timing, video, sound"

[dependencies]
puce-z80 = { git = "https://github.com/Farquaad56/CPU-Zilog-Z80_Crates_Rust", package = "puce-z80", features = ["serde", "disasm"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
