[package]
name = "galaxian-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "puce8-galaxian-gui"
path = "src/main.rs"

[dependencies]
galaxian-core = { path = "../galaxian-core" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
wgpu = { version = "25", default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
